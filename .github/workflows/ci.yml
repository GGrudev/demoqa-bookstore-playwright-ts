name: CI

# Push/PR: quality gate plus the offline suite (no DemoQA traffic).
# Manual dispatch: optionally run API and/or smoke against DemoQA.
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      suite:
        description: Live DemoQA suite to run after the quality gate
        required: true
        default: none
        type: choice
        options:
          - none
          - api
          - smoke
          - both

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write

jobs:
  quality:
    name: Lint, typecheck & format
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Check formatting
        run: npm run format:check

  offline-tests:
    name: Offline suite (contracts & API client)
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run offline tests
        run: npm run test:offline
        env:
          CI: true
          PLAYWRIGHT_WORKERS: 4

      - name: Upload offline Playwright report
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: playwright-report-offline
          path: playwright-report/
          retention-days: 14

      - name: Publish offline JUnit results
        if: always()
        uses: dorny/test-reporter@v3.0.0
        with:
          name: Offline Tests
          path: test-results/junit.xml
          reporter: java-junit
          fail-on-error: false

      - name: Upload offline test results
        if: failure()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: test-results-offline
          path: test-results/
          retention-days: 14

  demoqa-health:
    name: DemoQA health
    needs: quality
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.suite != 'none'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check DemoQA catalog
        run: npm run test:health

  api-tests:
    name: API tests (parallel)
    needs: [quality, demoqa-health]
    if: github.event_name == 'workflow_dispatch' && (github.event.inputs.suite == 'api' || github.event.inputs.suite == 'both')
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run API tests
        run: npm run test:api
        env:
          CI: true
          PLAYWRIGHT_WORKERS: 4

      - name: Upload API Playwright report
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: playwright-report-api
          path: playwright-report/
          retention-days: 14

      - name: Upload API JUnit report
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: junit-api
          path: test-results/junit.xml
          retention-days: 14
          if-no-files-found: warn

      - name: Publish API JUnit results
        if: always()
        uses: dorny/test-reporter@v3.0.0
        with:
          name: API Tests
          path: test-results/junit.xml
          reporter: java-junit
          fail-on-error: false

      - name: Upload API test results
        if: failure()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: test-results-api
          path: test-results/
          retention-days: 14

  smoke-tests:
    name: Smoke tests (parallel)
    needs: [quality, demoqa-health]
    if: github.event_name == 'workflow_dispatch' && (github.event.inputs.suite == 'smoke' || github.event.inputs.suite == 'both')
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Resolve Playwright version
        id: playwright-version
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright browser (cache miss)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright OS dependencies (cache hit)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Run smoke tests
        run: npm run test:smoke
        env:
          CI: true
          PLAYWRIGHT_WORKERS: 2
          DEMOQA_USERNAME: ${{ secrets.DEMOQA_USERNAME }}
          DEMOQA_PASSWORD: ${{ secrets.DEMOQA_PASSWORD }}

      - name: Upload smoke Playwright report
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: playwright-report-smoke
          path: playwright-report/
          retention-days: 14

      - name: Upload smoke JUnit report
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: junit-smoke
          path: test-results/junit.xml
          retention-days: 14
          if-no-files-found: warn

      - name: Publish smoke JUnit results
        if: always()
        uses: dorny/test-reporter@v3.0.0
        with:
          name: Smoke Tests
          path: test-results/junit.xml
          reporter: java-junit
          fail-on-error: false

      - name: Upload smoke test results
        if: failure()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: test-results-smoke
          path: test-results/
          retention-days: 14

  retry-summary:
    name: Retry summary
    needs: [api-tests, smoke-tests]
    if: >-
      always() &&
      github.event_name == 'workflow_dispatch' &&
      github.event.inputs.suite != 'none' &&
      (needs.api-tests.result == 'success' || needs.api-tests.result == 'failure' ||
       needs.smoke-tests.result == 'success' || needs.smoke-tests.result == 'failure')
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download JUnit reports
        continue-on-error: true
        uses: actions/download-artifact@v7.0.0
        with:
          pattern: junit-*
          path: junit-reports

      - name: Summarize retries
        run: node scripts/run-retry-summary.mjs junit-reports retry-summary.md

      - name: Upload retry summary
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: retry-summary
          path: retry-summary.md
          retention-days: 14
          if-no-files-found: warn
