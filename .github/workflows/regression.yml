name: Regression

on:
  workflow_dispatch:
    inputs:
      test_suite:
        description: Test suite to run
        required: true
        default: regression
        type: choice
        options:
          - smoke
          - regression
          - api
          - e2e
          - cross-browser
          - all
      workers:
        description: Parallel workers per job (1-4)
        required: true
        default: '2'
        type: choice
        options:
          - '1'
          - '2'
          - '4'
  schedule:
    # Weekly (Sunday 06:00 UTC). Not on push/PR — DemoQA is a shared public site.
    - cron: '0 6 * * 0'

concurrency:
  group: regression-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write

jobs:
  quality:
    name: Lint & format
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Check formatting
        run: npm run format:check

  resolve-suite:
    name: Resolve test matrix
    needs: quality
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      workers: ${{ steps.set-matrix.outputs.workers }}
      run_e2e: ${{ steps.set-matrix.outputs.run_e2e }}

    steps:
      - name: Build test matrix
        id: set-matrix
        run: |
          SUITE="${{ github.event.inputs.test_suite }}"
          if [ -z "$SUITE" ]; then
            SUITE="regression"
          fi

          WORKERS="${{ github.event.inputs.workers }}"
          if [ -z "$WORKERS" ]; then
            WORKERS="2"
          fi

          # Split the worker budget across two shards (floor of 1). Budget 2 → one
          # browser per shard. Budget 1 still runs one per shard.
          SHARD_WORKERS=$(( WORKERS / 2 ))
          if [ "$SHARD_WORKERS" -lt 1 ]; then
            SHARD_WORKERS=1
          fi

          # `browsers` drives the Playwright install step, so a job only downloads the
          # engines it actually runs. `shard` is empty unless the job should emit a blob.
          SMOKE='{"id":"smoke","npm_script":"test:smoke","artifact":"smoke","browsers":"chromium","shard":""}'
          API='{"id":"api","npm_script":"test:api","artifact":"api","browsers":"","shard":""}'
          E2E1='{"id":"e2e-1","npm_script":"test:e2e:shard:1","artifact":"e2e-1","browsers":"chromium","shard":"1","workers":"'"$SHARD_WORKERS"'"}'
          E2E2='{"id":"e2e-2","npm_script":"test:e2e:shard:2","artifact":"e2e-2","browsers":"chromium","shard":"2","workers":"'"$SHARD_WORKERS"'"}'
          CROSS='{"id":"cross-browser","npm_script":"test:cross-browser","artifact":"cross-browser","browsers":"firefox webkit","shard":""}'

          RUN_E2E=false
          case "$SUITE" in
            smoke)
              MATRIX="{\"include\":[$SMOKE]}"
              ;;
            api)
              MATRIX="{\"include\":[$API]}"
              ;;
            e2e)
              MATRIX="{\"include\":[$E2E1,$E2E2]}"
              RUN_E2E=true
              ;;
            cross-browser)
              MATRIX="{\"include\":[$CROSS]}"
              ;;
            regression)
              MATRIX="{\"include\":[$API,$E2E1,$E2E2]}"
              RUN_E2E=true
              ;;
            all)
              MATRIX="{\"include\":[$API,$E2E1,$E2E2,$CROSS]}"
              RUN_E2E=true
              ;;
            *)
              echo "Unknown suite: $SUITE"
              exit 1
              ;;
          esac

          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
          echo "workers=$WORKERS" >> "$GITHUB_OUTPUT"
          echo "run_e2e=$RUN_E2E" >> "$GITHUB_OUTPUT"

  demoqa-health:
    name: DemoQA health
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check DemoQA catalog
        run: npm run test:health

  test:
    name: ${{ matrix.id }} tests
    needs: [resolve-suite, demoqa-health]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.resolve-suite.outputs.matrix) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Resolve Playwright version
        if: matrix.browsers != ''
        id: playwright-version
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        if: matrix.browsers != ''
        id: playwright-cache
        uses: actions/cache@v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}-${{ matrix.id }}

      - name: Install Playwright browsers (cache miss)
        if: matrix.browsers != '' && steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps ${{ matrix.browsers }}

      - name: Install Playwright OS dependencies (cache hit)
        if: matrix.browsers != '' && steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps ${{ matrix.browsers }}

      - name: Run ${{ matrix.id }} tests
        run: npm run ${{ matrix.npm_script }}
        env:
          CI: true
          PLAYWRIGHT_WORKERS: ${{ matrix.workers || needs.resolve-suite.outputs.workers }}
          PLAYWRIGHT_BLOB_REPORT: ${{ matrix.shard != '' && '1' || '0' }}
          DEMOQA_USERNAME: ${{ secrets.DEMOQA_USERNAME }}
          DEMOQA_PASSWORD: ${{ secrets.DEMOQA_PASSWORD }}

      - name: Upload blob report (${{ matrix.artifact }})
        if: always() && matrix.shard != ''
        uses: actions/upload-artifact@v7.0.2
        with:
          name: blob-report-${{ matrix.shard }}
          path: blob-report/
          retention-days: 14
          if-no-files-found: warn

      - name: Upload Playwright report (${{ matrix.artifact }})
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: playwright-report-${{ matrix.artifact }}
          path: playwright-report/
          retention-days: 14

      - name: Upload JUnit report (${{ matrix.artifact }})
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: junit-${{ matrix.artifact }}
          path: test-results/junit.xml
          retention-days: 14
          if-no-files-found: warn

      - name: Publish JUnit results (${{ matrix.artifact }})
        if: always()
        uses: dorny/test-reporter@v3.0.0
        with:
          name: ${{ matrix.id }} Tests
          path: test-results/junit.xml
          reporter: java-junit
          fail-on-error: false

      - name: Upload test results (${{ matrix.artifact }})
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: test-results-${{ matrix.artifact }}
          path: test-results/
          retention-days: 14

  merge-e2e-report:
    name: Merge E2E report
    needs: [resolve-suite, test]
    if: >-
      always() &&
      needs.resolve-suite.outputs.run_e2e == 'true' &&
      (needs.test.result == 'success' || needs.test.result == 'failure')
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download shard blob reports
        uses: actions/download-artifact@v7.0.0
        with:
          pattern: blob-report-*
          path: all-blob-reports
          merge-multiple: true

      - name: Merge blob reports
        run: npx playwright merge-reports --config=playwright.config.ts ./all-blob-reports

      - name: Upload merged HTML report
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: playwright-report-e2e-merged
          path: playwright-report/
          retention-days: 14
          if-no-files-found: warn

      - name: Upload merged JUnit report
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: junit-e2e-merged
          path: test-results/junit.xml
          retention-days: 14
          if-no-files-found: warn

  retry-summary:
    name: Retry summary
    needs: test
    if: always() && (needs.test.result == 'success' || needs.test.result == 'failure')
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download JUnit reports
        continue-on-error: true
        uses: actions/download-artifact@v7.0.0
        with:
          pattern: junit-*
          path: junit-reports

      - name: Summarize retries
        run: node scripts/run-retry-summary.mjs junit-reports retry-summary.md

      - name: Upload retry summary
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: retry-summary
          path: retry-summary.md
          retention-days: 14
          if-no-files-found: warn
