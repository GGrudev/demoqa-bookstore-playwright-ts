name: Regression

on:
  workflow_dispatch:
    inputs:
      test_suite:
        description: Test suite to run
        required: true
        default: regression
        type: choice
        options:
          - smoke
          - regression
          - api
          - e2e
          - cross-browser
          - all
      workers:
        description: Parallel workers per job (1-4)
        required: true
        default: '2'
        type: choice
        options:
          - '1'
          - '2'
          - '4'
  schedule:
    # Weekly (Sunday 06:00 UTC). Not on push/PR — DemoQA is a shared public site.
    - cron: '0 6 * * 0'

concurrency:
  group: regression-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write

jobs:
  quality:
    name: Lint & format
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Check formatting
        run: npm run format:check

  resolve-suite:
    name: Resolve test matrix
    needs: quality
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      workers: ${{ steps.set-matrix.outputs.workers }}

    steps:
      - name: Build test matrix
        id: set-matrix
        run: |
          SUITE="${{ github.event.inputs.test_suite }}"
          if [ -z "$SUITE" ]; then
            SUITE="regression"
          fi

          WORKERS="${{ github.event.inputs.workers }}"
          if [ -z "$WORKERS" ]; then
            WORKERS="2"
          fi

          # `browsers` drives the Playwright install step, so a job only downloads the
          # engines it actually runs.
          SMOKE='{"id":"smoke","npm_script":"test:smoke","artifact":"smoke","browsers":"chromium"}'
          API='{"id":"api","npm_script":"test:api","artifact":"api","browsers":""}'
          E2E='{"id":"e2e","npm_script":"test:e2e","artifact":"e2e","browsers":"chromium"}'
          CROSS='{"id":"cross-browser","npm_script":"test:cross-browser","artifact":"cross-browser","browsers":"firefox webkit"}'

          case "$SUITE" in
            smoke)
              MATRIX="{\"include\":[$SMOKE]}"
              ;;
            api)
              MATRIX="{\"include\":[$API]}"
              ;;
            e2e)
              MATRIX="{\"include\":[$E2E]}"
              ;;
            cross-browser)
              MATRIX="{\"include\":[$CROSS]}"
              ;;
            regression)
              MATRIX="{\"include\":[$API,$E2E]}"
              ;;
            all)
              MATRIX="{\"include\":[$API,$E2E,$CROSS]}"
              ;;
            *)
              echo "Unknown suite: $SUITE"
              exit 1
              ;;
          esac

          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
          echo "workers=$WORKERS" >> "$GITHUB_OUTPUT"

  test:
    name: ${{ matrix.id }} tests
    needs: resolve-suite
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.resolve-suite.outputs.matrix) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Resolve Playwright version
        if: matrix.browsers != ''
        id: playwright-version
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        if: matrix.browsers != ''
        id: playwright-cache
        uses: actions/cache@v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}-${{ matrix.id }}

      - name: Install Playwright browsers (cache miss)
        if: matrix.browsers != '' && steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps ${{ matrix.browsers }}

      - name: Install Playwright OS dependencies (cache hit)
        if: matrix.browsers != '' && steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps ${{ matrix.browsers }}

      - name: Run ${{ matrix.id }} tests
        run: npm run ${{ matrix.npm_script }}
        env:
          CI: true
          PLAYWRIGHT_WORKERS: ${{ needs.resolve-suite.outputs.workers }}
          DEMOQA_USERNAME: ${{ secrets.DEMOQA_USERNAME }}
          DEMOQA_PASSWORD: ${{ secrets.DEMOQA_PASSWORD }}

      - name: Upload Playwright report (${{ matrix.artifact }})
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: playwright-report-${{ matrix.artifact }}
          path: playwright-report/
          retention-days: 14

      - name: Upload JUnit report (${{ matrix.artifact }})
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: junit-${{ matrix.artifact }}
          path: test-results/junit.xml
          retention-days: 14
          if-no-files-found: warn

      - name: Publish JUnit results (${{ matrix.artifact }})
        if: always()
        uses: dorny/test-reporter@v3.0.0
        with:
          name: ${{ matrix.id }} Tests
          path: test-results/junit.xml
          reporter: java-junit
          fail-on-error: false

      - name: Upload test results (${{ matrix.artifact }})
        if: failure()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: test-results-${{ matrix.artifact }}
          path: test-results/
          retention-days: 14
